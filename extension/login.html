<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGuard - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 40px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1f2937;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
        }

        input {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #d1d5db;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #d1d5db;
        }

        .demo-login {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .demo-login p {
            margin-bottom: 10px;
        }

        .demo-creds {
            background: white;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #4ade80;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🛡️</div>
        <h1>MindGuard</h1>
        <p class="subtitle">Sign in to your account</p>

        <form class="form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Sign In</button>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
        </form>

        <div class="divider">or</div>

        <div class="demo-login">
            <p><strong>Demo Login Available</strong></p>
            <p>Use these credentials to test the extension:</p>
            <div class="demo-creds">
                Email: demo@mindguard.com<br>
                Password: demo123
            </div>
            <button type="button" class="btn-login" onclick="demoLogin()" style="margin-top: 10px;">Demo Login</button>
        </div>

        <div class="register-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple validation (in production, use backend auth)
            if (email && password.length >= 6) {
                loginUser(email, password);
            } else {
                showError('Please enter valid credentials');
            }
        });

        function loginUser(email, password) {
            // Simulate user data
            const userData = {
                name: email.split('@')[0],
                email: email,
                role: 'user',
                loginTime: new Date().toISOString()
            };

            // Save to chrome storage
            chrome.storage.local.set({
                user: userData,
                isLoggedIn: true,
                stats: {
                    focusScore: 0,
                    blockedCount: 0,
                    completedCount: 0,
                    timeSaved: 0
                }
            }, () => {
                showSuccess('Login successful!');
                setTimeout(() => {
                    window.location.href = 'popup.html';
                }, 1000);
            });
        }

        function demoLogin() {
            loginUser('demo@mindguard.com', 'demo123');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = '✅ ' + message;
            successDiv.style.display = 'block';
        }

        // Check if already logged in
        chrome.storage.local.get(['user'], (result) => {
            if (result.user) {
                window.location.href = 'popup.html';
            }
        });
    </script>
</body>
</html>
