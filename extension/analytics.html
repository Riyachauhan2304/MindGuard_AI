<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - MindGuard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            padding: 5px 10px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 16px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .top-sites {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .top-sites h3 {
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 16px;
        }

        .site-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .site-name {
            font-weight: 600;
            color: #1f2937;
        }

        .site-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Analytics Dashboard</h1>
            <button class="close-btn" onclick="window.close()">✕</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="focusScore">0</div>
                <div class="stat-label">Focus Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛡️</div>
                <div class="stat-value" id="blockedCount">0</div>
                <div class="stat-label">Sites Blocked</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Challenges</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value"><span id="timeSaved">0</span>h</div>
                <div class="stat-label">Time Saved</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Activity This Week</h3>
                <div class="chart-container">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>🎯 Success Rate</h3>
                <div class="chart-container">
                    <canvas id="successChart"></canvas>
                </div>
            </div>
        </div>

        <div class="top-sites">
            <h3>🔝 Most Blocked Sites</h3>
            <div id="sitesList">
                <div class="empty-state">No activity yet</div>
            </div>
        </div>
    </div>

    <script>
        // Load analytics data
        chrome.storage.local.get(['stats', 'activity'], (result) => {
            const stats = result.stats || {
                focusScore: 0,
                blockedCount: 0,
                completedCount: 0,
                timeSaved: 0
            };

            document.getElementById('focusScore').textContent = stats.focusScore || 0;
            document.getElementById('blockedCount').textContent = stats.blockedCount || 0;
            document.getElementById('completedCount').textContent = stats.completedCount || 0;
            document.getElementById('timeSaved').textContent = Math.round((stats.timeSaved || 0) / 60);

            // Process activity
            const activity = result.activity || [];
            processActivity(activity);
        });

        function processActivity(activity) {
            // Get most blocked sites
            const siteCounts = {};
            activity.forEach(item => {
                if (item.site) {
                    siteCounts[item.site] = (siteCounts[item.site] || 0) + 1;
                }
            });

            const sorted = Object.entries(siteCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const container = document.getElementById('sitesList');
            if (sorted.length === 0) {
                container.innerHTML = '<div class="empty-state">No blocked sites yet</div>';
            } else {
                container.innerHTML = sorted.map(([site, count]) => `
                    <div class="site-item">
                        <span class="site-name">${site}</span>
                        <span class="site-count">${count} blocks</span>
                    </div>
                `).join('');
            }

            // Create charts
            createCharts(activity);
        }

        function createCharts(activity) {
            // Weekly chart
            const weeklyData = getWeeklyData(activity);
            const ctxWeekly = document.getElementById('weeklyChart');
            
            new Chart(ctxWeekly, {
                type: 'line',
                data: {
                    labels: weeklyData.labels,
                    datasets: [{
                        label: 'Blocked Sites',
                        data: weeklyData.data,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // Success chart
            const ctxSuccess = document.getElementById('successChart');
            const totalBlocked = activity.filter(a => a.action === 'blocked').length;
            const totalCompleted = activity.filter(a => a.action === 'completed').length;

            new Chart(ctxSuccess, {
                type: 'doughnut',
                data: {
                    labels: ['Unlocked', 'Blocked'],
                    datasets: [{
                        data: [totalCompleted, totalBlocked],
                        backgroundColor: ['#4ade80', '#f87171'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function getWeeklyData(activity) {
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const counts = [0, 0, 0, 0, 0, 0, 0];

            activity.forEach(item => {
                const date = new Date(item.timestamp);
                const dayIndex = date.getDay() - 1;
                if (dayIndex >= 0 && dayIndex < 7) {
                    counts[dayIndex]++;
                }
            });

            return { labels: days, data: counts };
        }
    </script>
</body>
</html>
