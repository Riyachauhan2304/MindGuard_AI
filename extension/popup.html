<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGuard - Focus Dashboard</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🛡️ MindGuard</div>
            <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <div class="avatar" id="userAvatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Welcome, User</div>
                <div class="user-status" id="userStatus">No sessions yet</div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="focusScore">0</div>
                <div class="stat-label">Focus Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛡️</div>
                <div class="stat-value" id="blockedCount">0</div>
                <div class="stat-label">Blocked Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value"><span id="timeSaved">0</span>m</div>
                <div class="stat-label">Time Saved</div>
            </div>
        </div>

        <!-- Motivation -->
        <div class="motivation-box">
            <p id="motivationText">"Focus is the gateway to productivity."</p>
        </div>

        <!-- Recent Activity -->
        <div class="section">
            <h3>📊 Today's Activity</h3>
            <div class="activity-list" id="activityList">
                <div class="empty-state">No activity yet today</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="section">
            <h3>⚡ Quick Actions</h3>
            <div class="action-buttons">
                <button class="action-btn" onclick="openRules()">📋 Manage Rules</button>
                <button class="action-btn" onclick="openAnalytics()">📈 Analytics</button>
            </div>
        </div>

        <!-- Current Blocking Status -->
        <div class="blocking-status">
            <div class="status-toggle">
                <span>Blocking Status:</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="blockingToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="status-text" id="statusText">✅ Actively Blocking</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
