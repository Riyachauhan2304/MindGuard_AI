<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules - MindGuard</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            background: var(--light);
            padding-top: 80px;
        }

        .page-header {
            background: var(--gradient-primary);
            color: var(--white);
            padding: 3rem 0;
            margin-bottom: 3rem;
            text-align: center;
        }

        .add-rule-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 3rem;
        }

        .add-rule-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light);
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
        }

        .btn-add {
            padding: 1rem 2rem;
            background: var(--gradient-primary);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .rules-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 3rem;
        }

        .rules-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .rules-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .rule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: var(--light);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .rule-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-sm);
        }

        .rule-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .rule-domain {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1rem;
        }

        .rule-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-block {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
        }

        .badge-allow {
            background: rgba(74, 222, 128, 0.2);
            color: var(--success);
        }

        .rule-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
        }

        .btn-delete {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: var(--white);
        }

        .quick-add {
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
        }

        .quick-add-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quick-add-btn {
            padding: 1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background: var(--white);
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-add-btn:hover {
            background: var(--gradient-primary);
            color: var(--white);
        }

        .quick-add-btn.added {
            background: var(--light);
            border-color: var(--gray);
            color: var(--gray);
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .add-rule-form {
                grid-template-columns: 1fr;
            }

            .rule-item {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <span>🛡️ MindGuard</span>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="rules.html">Rules</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header -->
    <div class="page-header">
        <div class="container">
            <h1>⚙️ Manage Rules</h1>
            <p>Control which sites to block or allow</p>
        </div>
    </div>

    <div class="container">
        <!-- Add Rule Form -->
        <div class="add-rule-card">
            <h3 style="margin-bottom: 1.5rem;">➕ Add New Rule</h3>
            <form id="addRuleForm" class="add-rule-form">
                <div class="form-group">
                    <label for="domain">Website Domain</label>
                    <input 
                        type="text" 
                        id="domain" 
                        class="form-input" 
                        placeholder="example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="action">Action</label>
                    <select id="action" class="form-select">
                        <option value="block">🚫 Block</option>
                        <option value="allow">✅ Allow</option>
                    </select>
                </div>

                <button type="submit" class="btn-add">Add Rule</button>
            </form>
        </div>

        <!-- Your Rules -->
        <div class="rules-section">
            <div class="rules-header">
                <h3>📋 Your Rules (<span id="rulesCount">0</span>)</h3>
            </div>
            <div id="rulesList" class="rules-list">
                <!-- Dynamically loaded -->
            </div>
        </div>

        <!-- Quick Add Popular Sites -->
        <div class="quick-add">
            <h3>💡 Quick Add Popular Sites</h3>
            <p style="color: var(--gray); margin-bottom: 1rem;">Click to add commonly blocked sites</p>
            <div class="quick-add-grid" id="quickAddGrid">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <script>
        const popularSites = [
            'youtube.com', 'instagram.com', 'facebook.com', 'twitter.com',
            'reddit.com', 'tiktok.com', 'netflix.com', 'twitch.tv',
            'pinterest.com', 'linkedin.com', 'snapchat.com', 'whatsapp.com'
        ];

        let userRules = [];

        async function loadRules() {
            const user = firebase.auth().currentUser;
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const result = await FirebaseHelper.getUserRules(user.uid);
            if (result.success) {
                userRules = result.rules;
                renderRules();
                renderQuickAdd();
            }
        }

        function renderRules() {
            const container = document.getElementById('rulesList');
            document.getElementById('rulesCount').textContent = userRules.length;

            if (userRules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No rules added yet. Add your first rule above!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = userRules.map(rule => `
                <div class="rule-item">
                    <div class="rule-info">
                        <div class="rule-domain">${rule.domain}</div>
                        <span class="rule-badge badge-${rule.action}">
                            ${rule.action === 'block' ? '🚫 Block' : '✅ Allow'}
                        </span>
                    </div>
                    <div class="rule-actions">
                        <button class="btn-icon btn-delete" onclick="deleteRule('${rule.id}')">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderQuickAdd() {
            const container = document.getElementById('quickAddGrid');
            container.innerHTML = popularSites.map(site => {
                const exists = userRules.some(r => r.domain === site);
                return `
                    <button 
                        class="quick-add-btn ${exists ? 'added' : ''}" 
                        onclick="quickAddSite('${site}')"
                        ${exists ? 'disabled' : ''}
                    >
                        ${exists ? '✓ ' : ''}${site}
                    </button>
                `;
            }).join('');
        }

        document.getElementById('addRuleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const domain = document.getElementById('domain').value.trim();
            const action = document.getElementById('action').value;

            // Check if rule already exists
            if (userRules.some(r => r.domain === domain)) {
                alert('Rule for this domain already exists!');
                return;
            }

            const result = await FirebaseHelper.addRule(domain, action);
            if (result.success) {
                document.getElementById('domain').value = '';
                loadRules();
            } else {
                alert('Failed to add rule: ' + result.error);
            }
        });

        async function quickAddSite(domain) {
            const result = await FirebaseHelper.addRule(domain, 'block');
            if (result.success) {
                loadRules();
            }
        }

        async function deleteRule(ruleId) {
            if (!confirm('Delete this rule?')) return;

            const result = await FirebaseHelper.deleteRule(ruleId);
            if (result.success) {
                loadRules();
            } else {
                alert('Failed to delete rule: ' + result.error);
            }
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                loadRules();
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
