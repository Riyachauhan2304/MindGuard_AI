<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MindGuard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <style>
        body {
            background: #f5f7fa;
            padding-top: 80px;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3rem 0;
            margin-bottom: 3rem;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .quick-actions {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .action-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container">
        <span>🛡️ MindGuard</span>
        <div>
            <a href="./dashboard.html">Dashboard</a>
            <a href="./analytics.html">Analytics</a>
            <a href="./rules.html">Rules</a>
            <a href="./settings.html">Settings</a>
        </div>
    </div>
</nav>

<!-- HEADER -->
<div class="dashboard-header">
    <div class="container">
        <h1>Welcome back, User 👋</h1>
        <p>Here's your focus journey today</p>
    </div>
</div>

<!-- STATS -->
<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value">75</div>
            <div>Focus Score</div>
        </div>

        <div class="stat-card">
            <div class="stat-value">12</div>
            <div>Blocked Today</div>
        </div>

        <div class="stat-card">
            <div class="stat-value">8</div>
            <div>Tasks Completed</div>
        </div>

        <div class="stat-card">
            <div class="stat-value">45 min</div>
            <div>Time Saved</div>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="quick-actions">
        <div class="action-card" onclick="go('rules.html')">⚙️ Rules</div>
        <div class="action-card" onclick="go('analytics.html')">📊 Analytics</div>
        <div class="action-card" onclick="go('settings.html')">🎨 Settings</div>
        <div class="action-card" onclick="go('history.html')">📝 History</div>
    </div>
</div>

<!-- JS -->
<script>
function go(page) {
    window.location.href = "./" + page;
}
</script>

</body>
</html>
